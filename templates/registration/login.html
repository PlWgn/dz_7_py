{% extends 'base.html' %}

{% block title %}Офис: вход{% endblock %}

{% block content %}
<h1>Вход</h1>
{% if form.errors %}
<p class="error">Неверное имя пользователя или пароль</p>
{% endif %}
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Войти</button>
</form>
{% endblock %}
