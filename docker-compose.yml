services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: office
      POSTGRES_USER: office
      POSTGRES_PASSWORD: office
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U office -d office']
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: >
      sh -c 'python manage.py migrate &&
             python manage.py create_roles &&
             python manage.py runserver 0.0.0.0:8000'
    environment:
      DEBUG: '1'
      ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: office
      POSTGRES_USER: office
      POSTGRES_PASSWORD: office
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
    ports:
      - '8000:8000'
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
